services:
  llama-server:
    image: ghcr.io/ggml-org/llama.cpp:server-vulkan
    devices:
      - /dev/dri:/dev/dri
    ports:
      - "8080:8080"
    volumes:
      - ${MODELS_DIR:?Set MODELS_DIR in .env}:/models:ro
      - ./start-llama.sh:/start-llama.sh:ro
      - llama-logs:/var/log/llama
    environment:
      LLAMA_CACHE: /models
      LLAMA_MODEL: unsloth/Qwen3.6-35B-A3B-MTP-GGUF:Q4_K_M
      LLAMA_AUTO_LOAD_MODEL: "true"
    entrypoint: ["/start-llama.sh"]
    command:
      - --models-preset
      - /models/models.ini
      - --no-models-autoload
      - --jinja
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --metrics
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  openwebui:
    image: ghcr.io/open-webui/open-webui:main-slim
    ports:
      - "3000:8080"
    environment:
      - ENABLE_OLLAMA_API=false
      - OPENAI_API_BASE_URL=http://llama-server:8080/v1
      - OPENAI_API_KEY=llama-server
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY:?Set WEBUI_SECRET_KEY in .env}
    volumes:
      - open-webui-data:/app/backend/data
    depends_on:
      - llama-server

  llama-metrics:
    image: llama-metrics-tui:latest
    build:
      context: .
      dockerfile: llama_metrics/Containerfile
    profiles: ["metrics"]
    stdin_open: true
    tty: true
    volumes:
      - llama-logs:/var/log/llama:ro
      - ${XDG_RUNTIME_DIR:-/run/user/1000}:/run/user/1000:ro
    environment:
      - LLAMA_MODEL=${LLAMA_MODEL:-unsloth/Qwen3.6-35B-A3B-MTP-GGUF:Q4_K_M}
      - LLAMA_API_URL=http://llama-server:8080
    depends_on:
      - llama-server

volumes:
  open-webui-data:
  llama-logs:
